name: End-to-End MLOps Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'tourism_project_v1/**'

jobs:
  data_preparation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r tourism_project_v1/requirements.txt

      - name: Data Registration Validation
        run: python tourism_project_v1/model_building/data_register.py

      - name: Data Preparation
        run: python tourism_project_v1/model_building/prep.py

      - name: Upload Train/Test Splits as Artifact
        uses: actions/upload-artifact@v3
        with:
          name: dataset-splits
          path: tourism_project_v1/data/*.csv

  model_building:
    needs: data_preparation
    runs-on: ubuntu-latest
    # This permission is required to allow GitHub Actions to push the model back to your repo
    permissions:
      contents: write 
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r tourism_project_v1/requirements.txt

      - name: Download Train/Test Splits
        uses: actions/download-artifact@v3
        with:
          name: dataset-splits
          path: tourism_project_v1/data/

      - name: Train and Tune Model
        run: python tourism_project_v1/model_building/train.py

      - name: Commit and Push Model
        run: |
          # Configuring Git with your specific GitHub details
          git config --global user.name 'rajmot1990'
          git config --global user.email 'rajmot1990@users.noreply.github.com'
          
          # Stage the new model and experiment logs
          git add tourism_project_v1/model.pkl
          git add tourism_project_v1/model_building/experiment_log.json
          
          # Commit and push using the default GitHub Actions token
          git commit -m "Automated model update via GitHub Actions" || echo "No changes to commit"
          git push
